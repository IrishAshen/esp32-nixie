name: Firmware (PlatformIO)

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: firmware

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio --version

      - name: Build firmware
        run: pio run

      - name: Archive firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binary
          path: firmware/.pio/build/esp32dev/firmware.bin
          retention-days: 7
