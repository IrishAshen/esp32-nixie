name: Android App (Gradle)

on:
  push:
    branches: [main]
    paths:
      - 'nixie_clock_app/**'
  pull_request:
    branches: [main]
    paths:
      - 'nixie_clock_app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nixie_clock_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: nixie_clock_app/app/build/reports/tests/
          retention-days: 14

      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: nixie_clock_app/app/build/outputs/apk/debug/*.apk
          retention-days: 7
