name: Firmware Server (.NET)

on:
  push:
    branches: [main]
    paths:
      - 'nixie_firmware_server/**'
  pull_request:
    branches: [main]
    paths:
      - 'nixie_firmware_server/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore nixie_firmware_server/NixieFirmwareServer.slnx

      - name: Build
        run: dotnet build --no-restore nixie_firmware_server/NixieFirmwareServer.slnx \
          --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release \
          nixie_firmware_server/NixieFirmwareServer.slnx \
          --logger "trx;LogFileName=test-results.trx"

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: nixie_firmware_server/**/TestResults/**/*
          retention-days: 14

      - name: Publish server
        run: dotnet publish --no-restore --configuration Release \
          --output publish \
          nixie_firmware_server/src/NixieFirmwareServer/NixieFirmwareServer.csproj

      - name: Archive published server
        uses: actions/upload-artifact@v4
        with:
          name: firmware-server-publish
          path: nixie_firmware_server/publish/
          retention-days: 7
