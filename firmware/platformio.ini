; Nixie Clock on ESP32 + DS3231 + 74HC595 + K155ID1
; PlatformIO project configuration
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.lto = true
monitor_speed = 115200

; Use no-OTA partition table – gives 3 MB for the app
; (our BLE + WiFi stack needs it). Standard table.
board_build.partitions = no_ota.csv

lib_deps =
    adafruit/RTClib @ ^2.1
    bblanchon/ArduinoJson @ ^7.0

build_flags =
    -Os
