; Nixie Clock on ESP32 + DS3231 + 74HC595 + K155ID1
; PlatformIO project configuration
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.lto = true
monitor_speed = 115200

build_flags =
    -Os

lib_deps =
    adafruit/RTClib @ ^2.1
    bblanchon/ArduinoJson @ ^7.0
    h2zero/NimBLE-Arduino @ ^1.4

; Exclude the built-in Bluedroid-based BLE stack (1.1 MB)
; and use NimBLE-Arduino instead (~200 KB)
lib_ignore = ESP32 BLE Arduino
