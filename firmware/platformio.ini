; Nixie Clock on ESP32 + DS3231 + 74HC595 + K155ID1
; PlatformIO project configuration
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
monitor_speed = 115200

lib_deps =
    adafruit/RTClib @ ^2.1
    bblanchon/ArduinoJson @ ^7.0
