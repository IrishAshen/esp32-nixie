; ══════════════════════════════════════════════════════════════════════════
;  Nixie Counter — test firmware
;
;  Простейшая прошивка для проверки платы: две ИН-12 одновременно
;  перебирают цифры 0–9 со сменой раз в CYCLES_MS миллисекунд.
;
;  Аппаратная часть:
;    ESP32 DevKit (30 pin)
;    74HC595 #1  — 8 бит
;      Q0–Q3 → К155ИД1 #1 → ИН-12 лампа 1
;      Q4–Q7 → К155ИД1 #2 → ИН-12 лампа 2
;
;  Пины:
;    GPIO 13 (DATA)    → 74HC595 DS
;    GPIO 14 (CLOCK)   → 74HC595 SH_CP
;    GPIO 15 (LATCH)   → 74HC595 ST_CP
; ══════════════════════════════════════════════════════════════════════════

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.lto = true
monitor_speed = 115200

build_flags =
    -Os
